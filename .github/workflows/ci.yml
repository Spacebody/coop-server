name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v --tb=short

      - name: Run smoke test (server-side)
        run: |
          # 起 server 后台跑
          mkdir -p test-deploy/data test-deploy/logs
          cat > test-deploy/config.yaml <<EOF
          server:
            host: "127.0.0.1"
            port: 17799
            transport: "streamable_http"
          auth:
            enabled: true
            token_file: "test-deploy/data/token"
            token_length: 32
          database:
            path: "test-deploy/data/coop.db"
          heartbeat:
            worker_interval_sec: 30
            timeout_sec: 90
            check_interval_sec: 30
          discovery:
            enabled: false
          logging:
            level: "INFO"
            file: "test-deploy/logs/coop.log"
            rotate_max_bytes: 10485760
            rotate_backup_count: 1
          EOF
          
          python -m coop_server --config test-deploy/config.yaml &
          SERVER_PID=$!
          sleep 3
          
          # 跑 smoke-test
          coop smoke-test \
              --host 127.0.0.1 --port 17799 \
              --token-file test-deploy/data/token
          
          kill $SERVER_PID || true
