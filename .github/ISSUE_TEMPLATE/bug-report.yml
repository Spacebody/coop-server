name: Bug Report
description: 报告一个 bug
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: 描述
      description: 简单描述遇到的问题
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 怎么复现?越具体越好
      placeholder: |
        1. 跑 coop ...
        2. 看到 ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你期望发生什么?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么?贴报错信息和日志
    validations:
      required: true

  - type: textarea
    id: env
    attributes:
      label: 环境
      description: |
        - OS (uname -a):
        - Python (python3 --version):
        - coop-server commit (git log -1 --oneline):
      render: text
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 其他信息
      description: 截图、日志片段、相关 issue 等
