[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coop-server"
version = "0.2.0"
description = "MCP server for Claude Code multi-agent collaboration over LAN"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Spacebody" },
]
keywords = ["mcp", "claude-code", "ai-collaboration", "anthropic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "mcp>=1.2.0",
    "aiosqlite>=0.20.0",
    "pyyaml>=6.0",
    "zeroconf>=0.131.0",
    "uvicorn>=0.30.0",
    "starlette>=0.37.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/Spacebody/coop-server"
Documentation = "https://github.com/Spacebody/coop-server/tree/main/docs"
Repository = "https://github.com/Spacebody/coop-server"
Issues = "https://github.com/Spacebody/coop-server/issues"
Changelog = "https://github.com/Spacebody/coop-server/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
coop-server = "coop_server.__main__:main"
coop = "cli.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["coop_server*", "cli*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
